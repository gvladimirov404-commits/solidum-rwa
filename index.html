<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solidum</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #d4af37;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .lang-switch {
            margin-top: 10px;
        }
        .lang-switch button {
            background: none;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        .lang-switch button.active {
            background: #d4af37;
            color: #121212;
        }
        .main-text {
            text-align: center;
            max-width: 600px;
            margin-bottom: 40px;
            font-size: 18px;
            line-height: 1.5;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        .btn {
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }
        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
        }
        .screen.active {
            display: block;
        }
        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 40px 0;
        }
        .tree {
            width: 200px;
            height: 300px;
            position: relative;
        }
        .seed {
            width: 20px;
            height: 20px;
            background-color: #8b6914;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: grow 3s ease-in-out forwards;
        }
        .roots {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
        }
        .root {
            position: absolute;
            bottom: 0;
            width: 2px;
            height: 0;
            background-color: #654321;
            animation: rootGrow 2s ease-out forwards;
        }
        .root:nth-child(1) { left: 30%; transform: rotate(-30deg); animation-delay: 0.5s; }
        .root:nth-child(2) { left: 50%; animation-delay: 0.7s; }
        .root:nth-child(3) { left: 70%; transform: rotate(30deg); animation-delay: 0.9s; }
        .trunk {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 0;
            background-color: #654321;
            animation: trunkGrow 2s ease-out 1s forwards;
        }
        .canopy {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            background-color: #2d5016;
            border-radius: 50%;
            animation: canopyGrow 2s ease-out 2s forwards;
        }
        @keyframes rootGrow {
            to { height: 40px; }
        }
        @keyframes trunkGrow {
            to { height: 150px; }
        }
        @keyframes canopyGrow {
            to { width: 120px; height: 120px; }
        }
        @keyframes grow {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.5); }
            100% { transform: translateX(-50%) scale(1); }
        }
        .guide-text {
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            margin: 20px 0;
            color: #d4af37;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Начален екран -->
    <div id="home-screen" class="screen active">
        <div class="header">
            <h1>Solidum</h1>
            <div class="lang-switch">
                <button onclick="setLang('bg')" class="active">BG</button>
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('ru')">RU</button>
                <button onclick="setLang('de')">DE</button>
                <button onclick="setLang('fr')">FR</button>
            </div>
        </div>

        <div class="main-text">
            <p id="title">Вашият сигурен мост към реална стойност.</p>
            <p id="desc">Превърнете спестяванията си в злато, земя и стабилност – без сложност, дори с малка сума.</p>
        </div>

        <div class="buttons">
            <button class="btn" id="btn1" onclick="showScreen('guide-screen')">🌱 Разбери как работи</button>
            <button class="btn" id="btn2">📊 Виж стойността</button>
        </div>

        <div class="footer">
            <p id="footer">🔒 Вашите данни са защитени.</p>
        </div>
    </div>

    <!-- Екран с гида -->
    <div id="guide-screen" class="screen">
        <div class="header">
            <h1>Solidum</h1>
        </div>

        <div class="tree-container">
            <div class="tree">
                <div class="canopy"></div>
                <div class="trunk"></div>
                <div class="roots">
                    <div class="root"></div>
                    <div class="root"></div>
                    <div class="root"></div>
                </div>
                <div class="seed"></div>
            </div>
        </div>

        <div class="guide-text">
            <p id="guide-text">Истинската стойност не се създава за миг. Тя пуска корени. Solidum е вашата здрава почва.</p>
        </div>

        <div style="text-align: center;">
            <button class="back-btn" onclick="showScreen('home-screen')" id="back-btn">← Назад</button>
        </div>
    </div>

    <script>
        const translations = {
            bg: { 
                title: "Вашият сигурен мост към реална стойност.", 
                desc: "Превърнете спестяванията си в злато, земя и стабилност – без сложност, дори с малка сума.", 
                btn1: "🌱 Разбери как работи", 
                btn2: " Виж стойността", 
                footer: "🔒 Вашите данни са защитени.",
                guide: "Истинската стойност не се създава за миг. Тя пуска корени. Solidum е вашата здрава почва.",
                back: "← Назад"
            },
            en: { 
                title: "Your secure bridge to real value.", 
                desc: "Turn your savings into gold, land, and stability – without complexity, even with a small amount.", 
                btn1: "🌱 Understand how it works", 
                btn2: "📊 See the value", 
                footer: "🔒 Your data is protected.",
                guide: "True value is not created in an instant. It takes root. Solidum is your solid ground.",
                back: "← Back"
            },
            ru: { 
                title: "Ваш надежный мост к реальной ценности.", 
                desc: "Превратите свои сбережения в золото, землю и стабильность – без сложностей, даже с небольшой суммой.", 
                btn1: "🌱 Узнайте, как это работает", 
                btn2: "📊 Оцените ценность", 
                footer: "🔒 Ваши данные защищены.",
                guide: "Истинная ценность не создается мгновенно. Она пускает корни. Solidum — ваша надежная почва.",
                back: "← Назад"
            },
            de: { 
                title: "Ihre sichere Brücke zu echtem Wert.", 
                desc: "Verwandeln Sie Ihre Ersparnisse in Gold, Land und Stabilität – ohne Komplexität, schon mit einem kleinen Betrag.", 
                btn1: " Verstehen Sie, wie es funktioniert", 
                btn2: "📊 Sehen Sie den Wert", 
                footer: "🔒 Ihre Daten sind geschützt.",
                guide: "Wahrer Wert entsteht nicht sofort. Er wurzelt. Solidum ist Ihr fester Boden.",
                back: "← Zurück"
            },
            fr: { 
                title: "Votre pont sécurisé vers la valeur réelle.", 
                desc: "Transformez vos économies en or, terre et stabilité – sans complexité, même avec un petit montant.", 
                btn1: "🌱 Comprendre comment ça marche", 
                btn2: "📊 Voir la valeur", 
                footer: " Vos données sont protégées.",
                guide: "La vraie valeur ne se crée pas instantanément. Elle prend racine. Solidum est votre sol solide.",
                back: "← Retour"
            }
        };

        let currentLang = 'bg';

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('desc').innerText = translations[lang].desc;
            document.getElementById('btn1').innerText = translations[lang].btn1;
            document.getElementById('btn2').innerText = translations[lang].btn2;
            document.getElementById('footer').innerText = translations[lang].footer;
            document.getElementById('guide-text').innerText = translations[lang].guide;
            document.getElementById('back-btn').innerText = translations[lang].back;
            
            document.querySelectorAll('.lang-switch button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
